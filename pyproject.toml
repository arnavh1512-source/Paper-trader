[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-trader"
version = "2.0.0"
description = "Paper-trading research bot with a shared live/backtest decision path (NSE and US)."
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "pydantic>=2.7,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
claude-trader = "claude_trader.cli:main"

[tool.setuptools.packages.find]
include = ["claude_trader*"]

[tool.pytest.ini_options]
# -q keeps a 875-test run readable; --strict-markers turns a typo in a marker
# into a failure rather than a test that silently never runs.
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:claude_trader.*"]

[tool.coverage.run]
source = ["claude_trader"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ['pragma: no cover', 'if TYPE_CHECKING:', '\.\.\.']
