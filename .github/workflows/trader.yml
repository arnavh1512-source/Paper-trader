name: Paper trader

# One job per trading day, looping hourly inside itself. The bot decides for
# itself whether the market is open, so a cycle outside the session (or on a
# holiday) is a harmless no-op.
#
# NSE runs 09:15-15:30 IST = 03:45-10:00 UTC.
# NYSE runs 09:30-16:00 ET  = 13:30-20:00 UTC (14:30-21:00 in winter).
# Only one of the two cron blocks should be active; MARKET decides which.

on:
  schedule:
    # Cron here only has to START the day's job; the hourly cadence lives in
    # the "Trade the session" loop below. GitHub's scheduler is not a clock:
    # hourly crons arrived 34-54 minutes late on day one, and later hours
    # late with whole ticks dropped, so a cadence expressed as cron times was
    # a cadence nobody controlled.
    #
    # Hourly, not every 15 minutes: a 3-position momentum book re-decides the
    # same thing four times an hour, and on `claude` that is ~3.5x the bill.
    # The cadence applies identically to every arm, so it does not
    # contaminate the comparison.
    #
    # Three triggers, off the hour (the top of the hour is when GitHub is most
    # loaded and most likely to delay or drop), none before the 03:45 UTC open.
    # Whichever arrives first trades the rest of the session. The concurrency
    # group queues the others behind it -- a newer pending run replaces an
    # older one -- so a late or dropped trigger is covered by the next, and a
    # queued run that starts after the close is a cheap no-op.
    - cron: '47 3 * * 1-5'      # 09:17 IST
    - cron: '23 5 * * 1-5'      # 10:53 IST
    - cron: '17 7 * * 1-5'      # 12:47 IST
    # US: uncomment below, comment out the NSE lines, and set SESSION_CLOSE_UTC
    # to the NYSE close (20:00, or 21:00 in winter).
    # - cron: '47 13 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to trade'
        type: choice
        options: [in, us]
        default: 'in'
      segment:
        description: 'NSE cash segment'
        type: choice
        options: [intraday, delivery]
        default: 'intraday'
      strategy:
        # A manual run is ONE cycle of ONE strategy -- the way to poke the
        # pipeline by hand. Scheduled NSE runs trade every arm every hour.
        # `momentum` is the deterministic control group and `momentum_plus`
        # the filtered rule; neither needs an API key. Each keeps its own
        # paper account, so no arm contaminates another's journal.
        description: 'Which strategy decides (manual run: one cycle)'
        type: choice
        options: [momentum, momentum_plus, claude]
        default: 'momentum'
      dry_run:
        description: 'Journal decisions, send no orders'
        type: boolean
        default: false

concurrency:
  # Two cycles writing the same journal would corrupt the account history.
  group: paper-trader
  cancel-in-progress: false

permissions:
  contents: read
  # Publishing the dashboard to GitHub Pages. `pages: write` deploys it and
  # `id-token: write` is what deploy-pages uses to prove the deployment came
  # from this workflow run rather than from a token someone copied out.
  pages: write
  id-token: write

jobs:
  trade:
    runs-on: ubuntu-latest
    # The 360-minute ceiling on GitHub-hosted runners, less a margin. The loop
    # step carries its own tighter timeout, so a hang inside it still leaves
    # time to save the journal. tests/test_schedule.py pins how these fit.
    timeout-minutes: 355

    env:
      MARKET: ${{ inputs.market || vars.MARKET || 'in' }}
      TRADE_SEGMENT: ${{ inputs.segment || vars.TRADE_SEGMENT || 'intraday' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || vars.DRY_RUN || '0' }}
      # The strategy for a MANUAL run, and for scheduled US runs. Scheduled NSE
      # runs ignore it and trade every arm -- see "Trade the session".
      #
      # Defaults to the keyless control, not to `claude`. Every scheduled run
      # today died on exit 2 -- ConfigError, no ANTHROPIC_API_KEY -- because a
      # schedule supplies no inputs and the default assumed a key that does not
      # exist yet. A default that only works once a secret is configured is a
      # default that fails silently until someone reads a log.
      #
      # This is a declared default, not a runtime fallback: the bot still
      # refuses to quietly swap strategies mid-run, because that would mean
      # journalling one strategy's decisions under another's name. Set the
      # STRATEGY repository variable to 'claude' when the key exists.
      STRATEGY: ${{ inputs.strategy || vars.STRATEGY || 'momentum' }}

      # The book, and the sizing that has to be coherent with it. These are
      # passed explicitly because .env is gitignored and never reaches the
      # runner: without them every scheduled cycle would silently fall back to
      # the profile's one-lakh defaults and measure a different account than
      # the one being run locally. Override any of them as repository
      # variables under Settings -> Secrets and variables -> Actions.
      STARTING_CASH: ${{ vars.STARTING_CASH || '5000' }}
      # Left to RiskConfig.from_env, which derives both from equity:
      # 40% of it per trade, and a floor of 5% capped at the Indian
      # minimum ticket. Pinning them to rupee figures is how they end up
      # describing a balance the account no longer has.
      MAX_NOTIONAL_PER_TRADE: ${{ vars.MAX_NOTIONAL_PER_TRADE || '' }}
      MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT || '0.40' }}
      MIN_TRADE_NOTIONAL: ${{ vars.MIN_TRADE_NOTIONAL || '' }}
      # Square-off must be reachable by the LAST cycle of the day, because
      # nothing runs after it to catch a miss. The loop's last slot is
      # 09:05 UTC (14:35 IST), so the cut-off has to sit at or before it: 60
      # minutes before the 15:30 close puts it at 14:30, with the slot inside
      # the window and every arm's cycle landing well before the bell.
      #
      # A tighter window is not "more trading time", it is a coin flip on
      # whether intraday positions get closed at all. Missing it carries them
      # overnight while the intraday cost model still bills intraday rates,
      # which corrupts the P&L the whole experiment is measuring.
      SQUARE_OFF_MINUTES: ${{ vars.SQUARE_OFF_MINUTES || '60' }}
      MAX_POSITIONS: ${{ vars.MAX_POSITIONS || '3' }}
      MAX_SECTOR_POSITIONS: ${{ vars.MAX_SECTOR_POSITIONS || '1' }}
      # Deliberately the market's full default universe. The position cap is a
      # fraction of equity, so expensive names become reachable on their own as
      # the account grows; a pinned list would freeze that shut.
      UNIVERSE: ${{ vars.UNIVERSE || '' }}
      # Headlines are part of the experiment: the question is whether the model uses
      # them well. Set the NEWS_ENABLED repository variable to 'false' to run the
      # same book blind and compare. Backtests ignore this either way.
      NEWS_ENABLED: ${{ vars.NEWS_ENABLED || 'true' }}
      JOURNAL_PATH: data/journal.sqlite3
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Sonnet is the point of the experiment. The question is whether a
      # frontier model beats a twenty-line SMA rule; a smaller model losing
      # would not distinguish a failed idea from an under-powered one.
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
      # The loop's clock. Structural, not tuning knobs, so they are literals
      # rather than repository variables: tests/test_schedule.py runs the loop
      # with these exact values and asserts it squares off and ends in time.
      #
      # SESSION_CLOSE_UTC is the NSE close (markets/india.py) in UTC. IST has
      # no DST, so a constant is exact; the test checks it against the profile.
      SESSION_CLOSE_UTC: '10:00'
      # Cycles run at HH:05 UTC (HH:35 IST), plus once immediately on start.
      CYCLE_SLOT_MINUTE: '5'
      # No new iteration starts after this many minutes; the arms of one that
      # has started run to completion. 320 keeps the job under the 6h ceiling
      # and still reaches the 09:05 square-off slot from a job started by the
      # earliest cron.
      LOOP_BUDGET_MINUTES: '320'
      # A cycle normally takes about a minute. A hung feed or model call is
      # killed here rather than eating the rest of the day's loop. Three arms
      # all hung in the last iteration overrun the budget by 3 x 8 = 24
      # minutes, which 320 + 24 = 344 keeps inside the 345-minute step.
      CYCLE_TIMEOUT_MINUTES: '8'
      # Unlimited by default: an hourly cycle makes at most ~5 calls and cannot
      # run away. Set this as a repository variable if you want a hard stop.
      # Hitting it raises LLMBudgetExceeded, which the strategy already degrades
      # to HOLD -- stops and square-off do not consult the model, so a spent
      # budget can block an entry but never an exit.
      MAX_API_CALLS: ${{ vars.MAX_API_CALLS || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # The journal IS the account for the paper broker: positions, cash,
      # drawdown state and the LLM response cache all live in it. Losing it
      # resets the account to its starting balance and silently erases a
      # drawdown halt, so it is restored before the loop and saved after.
      # Every arm shares the one file; PaperBroker keeps a separate account per
      # strategy inside it.
      - name: Restore journal
        id: journal
        uses: actions/cache/restore@v6
        with:
          path: data/journal.sqlite3
          key: journal-${{ env.MARKET }}-${{ github.run_id }}
          restore-keys: |
            journal-${{ env.MARKET }}-

      - name: Report journal state
        run: |
          if [ -f data/journal.sqlite3 ]; then
            echo "::notice::Journal restored ($(du -h data/journal.sqlite3 | cut -f1))"
          else
            echo "::warning::No journal restored -- this cycle starts from a fresh account."
          fi

      # Every arm, every hour: momentum first (the control), then
      # momentum_plus (no key, never billed), then claude. A failure in one
      # arm must never cost another its cycle, its later iterations, or the
      # journal save after the loop.
      #
      # Dual mode is scheduled-and-NSE only. NSE runs on the journal-backed
      # PaperBroker, which keeps an account per strategy. US runs on Alpaca,
      # which has ONE server-side paper account: two strategies there would
      # trade the same book and each journal the other's fills, so US keeps
      # the single STRATEGY. A manual run is always one cycle of one strategy.
      - name: Trade the session
        timeout-minutes: 345
        run: |
          set -u
          now() { date -u +%s; }
          start=$(now)
          day=$(( start - start % 86400 ))
          close=$(( day + 10#${SESSION_CLOSE_UTC%:*} * 3600 + 10#${SESSION_CLOSE_UTC#*:} * 60 ))
          budget_end=$(( start + LOOP_BUDGET_MINUTES * 60 ))
          deadline=$(( close < budget_end ? close : budget_end ))
          slot=$(( CYCLE_SLOT_MINUTE * 60 ))

          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$MARKET" = in ]; then
            arms="momentum momentum_plus claude"
          else
            arms="$STRATEGY"
          fi

          failed=0
          cycle() {
            for arm in $arms; do
              # The secrets context is not readable from a step-level `if:`,
              # so the guard lives here. No key is a normal state, not a
              # failure: the control keeps running and building its baseline.
              if [ "$arm" = claude ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                echo "ANTHROPIC_API_KEY not set; skipping the claude cycle"
                continue
              fi
              echo "::group::$arm cycle at $(date -u +%H:%M) UTC"
              # Never retried: a cycle that died may already have placed an
              # order, and a retry would be a second one. The next slot is the
              # retry, with a fresh look at the book.
              timeout "${CYCLE_TIMEOUT_MINUTES}m" python -m claude_trader trade --strategy "$arm" \
                || { echo "::warning::$arm cycle failed (exit $?)"; failed=1; }
              echo "::endgroup::"
            done
          }

          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            cycle
            exit "$failed"
          fi

          # ponytail: the first cycle runs on arrival, so a job that starts at
          # HH:03 cycles again at HH:05. A doubled cycle re-decides the same
          # book; a minimum gap enforced here could skip the 09:05 square-off.
          while [ "$(now)" -lt "$deadline" ]; do
            cycle
            t=$(now)
            next=$(( (t - slot) / 3600 * 3600 + 3600 + slot ))
            if [ "$next" -ge "$deadline" ]; then
              break
            fi
            sleep $(( next - t ))
          done
          # Red if any cycle failed, after every cycle has had its turn. The
          # steps below all run under always(), so the journal is still saved.
          exit "$failed"

      # The page you actually look at. Written from the journal after the loop,
      # so it describes the whole session the job just traded.
      - name: Render dashboard
        if: always()
        run: python -m claude_trader dashboard --out data/dashboard.html || true

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-${{ env.MARKET }}
          path: data/dashboard.html
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

      # Published to GitHub Pages so it can be checked from a phone without
      # downloading an artifact. No account or secret: the repository already
      # has a token that can publish. Enable it once under
      # Settings -> Pages -> Source: GitHub Actions.
      #
      # NOTE: on a public repository the published page is public. It shows the
      # paper account's positions, decisions and P&L.
      - name: Stage dashboard for Pages
        if: always()
        run: |
          mkdir -p public
          if [ -s data/dashboard.html ]; then
            cp data/dashboard.html public/index.html
          else
            # Never publish an empty directory over a working page, and say why
            # rather than showing a stale page as if it were current.
            {
              printf '%s' '<!doctype html><meta charset=utf-8>'
              printf '%s' '<title>claude-trader</title>'
              printf '%s' '<p>The cycle on '"$(date -u +'%Y-%m-%d %H:%M UTC')"' produced no dashboard. '
              printf '%s' '<a href="'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'">See the run log.</a>'
            } > public/index.html
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Save journal
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/journal.sqlite3
          key: journal-${{ env.MARKET }}-${{ github.run_id }}

      # A second, human-readable copy. Caches are evicted after 7 idle days and
      # can be dropped when the repo cache fills; the artifact is the backup you
      # download if that happens.
      - name: Upload journal artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journal-${{ env.MARKET }}
          path: data/journal.sqlite3
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

  # A separate job because deploy-pages must own the github-pages environment,
  # and because a failure to publish must never be able to fail the cycle that
  # already traded. `needs` without `if: always()` is deliberate the other way
  # round: if the trade job died before writing a dashboard, there is nothing
  # worth publishing.
  publish:
    needs: trade
    # `always()` because a cycle that failed is exactly when you want to look at
    # the page. The staging step runs under `always()` too and writes a
    # placeholder naming the run, so there is something honest to publish either
    # way -- a stale page left up after a failure reads as a working bot.
    if: always()
    runs-on: ubuntu-latest
    # A hosting failure must not paint the trading cycle's result red -- in
    # either direction. It is recorded on this job and goes no further.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
