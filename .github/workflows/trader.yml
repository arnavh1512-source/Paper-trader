name: Paper trader

# One cycle per schedule tick. The bot decides for itself whether the market is
# open, so a few ticks outside the session are harmless no-ops -- GitHub's cron
# is best-effort and routinely fires several minutes late, which is exactly why
# the window is padded rather than pinned to the bell.
#
# NSE runs 09:15-15:30 IST = 03:45-10:00 UTC.
# NYSE runs 09:30-16:00 ET  = 13:30-20:00 UTC (14:30-21:00 in winter).
# Only one of the two cron blocks should be active; MARKET decides which.

on:
  schedule:
    # Hourly, not every 15 minutes. A 3-position momentum book re-decides the
    # same thing four times an hour; the extra cycles bought noise and, on the
    # `claude` strategy, roughly 3.5x the API bill. Same experiment, same
    # universe, same risk gate -- and the cadence applies identically to both
    # strategies, so it does not contaminate the comparison.
    #
    # Nominal times below are what cron asks for. GitHub delivers late -- the
    # first day of hourly running drifted 34, 47 and 54 minutes on consecutive
    # ticks. Treat 0-60 minutes of lateness as normal and design for the whole
    # range; anything that has to happen inside a narrow window cannot be
    # expressed as a cron time here. tests/test_schedule.py pins this.
    - cron: '0 4-9 * * 1-5'     # nominal 09:30-14:30 IST; lands 09:30-15:30
    # - cron: '0 14-20 * * 1-5'   # uncomment for US, comment out the NSE line
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to trade'
        type: choice
        options: [in, us]
        default: 'in'
      segment:
        description: 'NSE cash segment'
        type: choice
        options: [intraday, delivery]
        default: 'intraday'
      strategy:
        # `momentum` is the deterministic control group and needs no API key at
        # all, so it is the way to exercise the whole pipeline -- and to build a
        # baseline to measure the model against -- before ANTHROPIC_API_KEY
        # exists. The two keep separate paper accounts, so neither contaminates
        # the other's journal.
        description: 'Which strategy decides'
        type: choice
        options: [claude, momentum]
        default: 'claude'
      dry_run:
        description: 'Journal decisions, send no orders'
        type: boolean
        default: false

concurrency:
  # Two cycles writing the same journal would corrupt the account history.
  group: paper-trader
  cancel-in-progress: false

permissions:
  contents: read
  # Publishing the dashboard to GitHub Pages. `pages: write` deploys it and
  # `id-token: write` is what deploy-pages uses to prove the deployment came
  # from this workflow run rather than from a token someone copied out.
  pages: write
  id-token: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      MARKET: ${{ inputs.market || vars.MARKET || 'in' }}
      TRADE_SEGMENT: ${{ inputs.segment || vars.TRADE_SEGMENT || 'intraday' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || vars.DRY_RUN || '0' }}
      # Defaults to the keyless control, not to `claude`. Every scheduled run
      # today died on exit 2 -- ConfigError, no ANTHROPIC_API_KEY -- because a
      # schedule supplies no inputs and the default assumed a key that does not
      # exist yet. A default that only works once a secret is configured is a
      # default that fails silently until someone reads a log.
      #
      # This is a declared default, not a runtime fallback: the bot still
      # refuses to quietly swap strategies mid-run, because that would mean
      # journalling one strategy's decisions under another's name. Set the
      # STRATEGY repository variable to 'claude' when the key exists.
      STRATEGY: ${{ inputs.strategy || vars.STRATEGY || 'momentum' }}

      # The book, and the sizing that has to be coherent with it. These are
      # passed explicitly because .env is gitignored and never reaches the
      # runner: without them every scheduled cycle would silently fall back to
      # the profile's one-lakh defaults and measure a different account than
      # the one being run locally. Override any of them as repository
      # variables under Settings -> Secrets and variables -> Actions.
      STARTING_CASH: ${{ vars.STARTING_CASH || '5000' }}
      # Left to RiskConfig.from_env, which derives both from equity:
      # 40% of it per trade, and a floor of 5% capped at the Indian
      # minimum ticket. Pinning them to rupee figures is how they end up
      # describing a balance the account no longer has.
      MAX_NOTIONAL_PER_TRADE: ${{ vars.MAX_NOTIONAL_PER_TRADE || '' }}
      MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT || '0.40' }}
      MIN_TRADE_NOTIONAL: ${{ vars.MIN_TRADE_NOTIONAL || '' }}
      # Square-off must be reachable by the LAST tick of the day under the full
      # drift range, because there is no tick after it to catch a miss. The
      # 14:30 tick lands anywhere in 14:30-15:30 IST, so the cut-off has to sit
      # at or before 14:30 -- that is 60 minutes before the 15:30 close.
      #
      # A tighter window is not "more trading time", it is a coin flip on
      # whether intraday positions get closed at all. Missing it carries them
      # overnight while the intraday cost model still bills intraday rates,
      # which corrupts the P&L the whole experiment is measuring.
      SQUARE_OFF_MINUTES: ${{ vars.SQUARE_OFF_MINUTES || '60' }}
      MAX_POSITIONS: ${{ vars.MAX_POSITIONS || '3' }}
      MAX_SECTOR_POSITIONS: ${{ vars.MAX_SECTOR_POSITIONS || '1' }}
      # Deliberately the market's full default universe. The position cap is a
      # fraction of equity, so expensive names become reachable on their own as
      # the account grows; a pinned list would freeze that shut.
      UNIVERSE: ${{ vars.UNIVERSE || '' }}
      # Headlines are part of the experiment: the question is whether the model uses
      # them well. Set the NEWS_ENABLED repository variable to 'false' to run the
      # same book blind and compare. Backtests ignore this either way.
      NEWS_ENABLED: ${{ vars.NEWS_ENABLED || 'true' }}
      JOURNAL_PATH: data/journal.sqlite3
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Sonnet is the point of the experiment. The question is whether a
      # frontier model beats a twenty-line SMA rule; a smaller model losing
      # would not distinguish a failed idea from an under-powered one.
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
      # Unlimited by default: an hourly cycle makes at most ~5 calls and cannot
      # run away. Set this as a repository variable if you want a hard stop.
      # Hitting it raises LLMBudgetExceeded, which the strategy already degrades
      # to HOLD -- stops and square-off do not consult the model, so a spent
      # budget can block an entry but never an exit.
      MAX_API_CALLS: ${{ vars.MAX_API_CALLS || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # The journal IS the account for the paper broker: positions, cash,
      # drawdown state and the LLM response cache all live in it. Losing it
      # resets the account to its starting balance and silently erases a
      # drawdown halt, so it is restored before the cycle and saved after.
      - name: Restore journal
        id: journal
        uses: actions/cache/restore@v4
        with:
          path: data/journal.sqlite3
          key: journal-${{ env.MARKET }}-${{ github.run_id }}
          restore-keys: |
            journal-${{ env.MARKET }}-

      - name: Report journal state
        run: |
          if [ -f data/journal.sqlite3 ]; then
            echo "::notice::Journal restored ($(du -h data/journal.sqlite3 | cut -f1))"
          else
            echo "::warning::No journal restored -- this cycle starts from a fresh account."
          fi

      - name: Run one cycle
        run: python trader.py

      # The page you actually look at. Written from the journal after the cycle,
      # so it always describes the run that just happened.
      - name: Render dashboard
        if: always()
        run: python -m claude_trader dashboard --out data/dashboard.html || true

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ env.MARKET }}
          path: data/dashboard.html
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

      # Publish the dashboard so it can be checked from a phone without
      # downloading an artifact. Skipped silently when VERCEL_TOKEN is not set,
      # because the bot must keep trading whether or not hosting is configured.
      #
      # NOTE: a Vercel deployment URL is public to anyone who has it. This
      # publishes the paper account's positions, decisions and P&L.
      - name: Publish dashboard to Vercel
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # The secrets context is not readable from a step-level `if:`, so the
          # guard lives here. No token configured is a normal state, not a
          # failure -- hosting is optional, trading is not.
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set; skipping publish"; exit 0
          fi
          test -s data/dashboard.html || { echo "no dashboard to publish"; exit 0; }
          mkdir -p public
          cp data/dashboard.html public/index.html
          npx --yes vercel@latest deploy public --prod --yes --archive=tgz --token "$VERCEL_TOKEN" || echo "vercel deploy failed; continuing"

      # The Pages copy. Vercel needs an account and three secrets; this needs
      # neither, because the repository already has a token that can publish.
      # Enable it once under Settings -> Pages -> Source: GitHub Actions.
      #
      # NOTE: on a public repository the published page is public. It shows the
      # paper account's positions, decisions and P&L.
      - name: Stage dashboard for Pages
        if: always()
        run: |
          mkdir -p public
          if [ -s data/dashboard.html ]; then
            cp data/dashboard.html public/index.html
          else
            # Never publish an empty directory over a working page, and say why
            # rather than showing a stale page as if it were current.
            {
              printf '%s' '<!doctype html><meta charset=utf-8>'
              printf '%s' '<title>claude-trader</title>'
              printf '%s' '<p>The cycle on '"$(date -u +'%Y-%m-%d %H:%M UTC')"' produced no dashboard. '
              printf '%s' '<a href="'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'">See the run log.</a>'
            } > public/index.html
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Save journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/journal.sqlite3
          key: journal-${{ env.MARKET }}-${{ github.run_id }}

      # A second, human-readable copy. Caches are evicted after 7 idle days and
      # can be dropped when the repo cache fills; the artifact is the backup you
      # download if that happens.
      - name: Upload journal artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ env.MARKET }}
          path: data/journal.sqlite3
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

  # A separate job because deploy-pages must own the github-pages environment,
  # and because a failure to publish must never be able to fail the cycle that
  # already traded. `needs` without `if: always()` is deliberate the other way
  # round: if the trade job died before writing a dashboard, there is nothing
  # worth publishing.
  publish:
    needs: trade
    # `always()` because a cycle that failed is exactly when you want to look at
    # the page. The staging step runs under `always()` too and writes a
    # placeholder naming the run, so there is something honest to publish either
    # way -- a stale page left up after a failure reads as a working bot.
    if: always()
    runs-on: ubuntu-latest
    # A hosting failure must not paint the trading cycle's result red -- in
    # either direction. It is recorded on this job and goes no further.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
